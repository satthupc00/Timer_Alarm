<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mondiro Timer Alarm</title>
<style>
:root{
  --bg:#F7F5F1;        /* nền kem rất nhạt */
  --card:#FFFFFF;
  --line:#ECE7DF;
  --soft:#F2EEE8;      /* nền nút phụ */
  --text:#2A2D33;
  --muted:#8A8F98;
  --red:#E5383B;
  --red-soft:#FDECEC;
  --peach:#FFF3E2; --peach-ink:#E59A2E;   /* mục ăn sáng */
  --sky:#EAF1FA;   --sky-ink:#5B7FA8;     /* mục 3G */
  --mint:#E7F6EC;  --green:#2EAE5B;       /* trạng thái OK / latest */
  --ease-out:cubic-bezier(.22,1,.36,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --t-fast:.12s; --t-med:.22s;
}
*{box-sizing:border-box}
html,body{margin:0;background:#DCD8D1;color:var(--text);
  font:14px/1.45 "Segoe UI",Roboto,system-ui,sans-serif}
.page{padding:24px 16px 40px;display:flex;flex-direction:column;align-items:center;gap:14px}
.page h1{font-size:18px;margin:0}
.page p.note{margin:0;color:#5d6068;font-size:13px;text-align:center;max-width:820px}
.seg{display:flex;background:#fff;border-radius:999px;padding:4px;gap:4px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.seg button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font:inherit;cursor:pointer;color:var(--muted);
  transition:background-color var(--t-fast),color var(--t-fast),transform var(--t-med) var(--ease-out)}
.seg button.on{background:var(--red);color:#fff}
.seg button:active{transform:scale(.95)}

/* ---------- Khung điện thoại Z Fold 7 ---------- */
.devices{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.dev{display:flex;flex-direction:column;align-items:center;gap:8px}
.dev .cap{font-size:12px;color:#5d6068}
.phone{background:#1d1e22;border-radius:34px;padding:9px;box-shadow:0 18px 40px rgba(0,0,0,.18)}
.screen{background:var(--bg);border-radius:26px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.outer .screen{width:360px;height:840px}       /* 1080x2520 -> 21:9 */
.inner .screen{width:700px;height:630px}       /* 1968x2184 gần vuông (ngang) */
.status{height:26px;flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-size:11px;color:var(--muted)}
.scroll{flex:1;overflow:auto;padding:4px 16px 0;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* ---------- Header ---------- */
.top{display:flex;align-items:center;gap:10px;padding:8px 2px 14px}
.brand-icon{width:40px;height:40px;flex:0 0 auto;border-radius:11px;box-shadow:0 4px 10px rgba(229,56,59,.18)}
.brand-text{flex:1;min-width:0}
.brand-name{font-size:18px;font-weight:700;line-height:1.15;white-space:nowrap;display:flex;align-items:center;gap:6px}
.brand-name .m{color:var(--red)} .brand-name .a{color:var(--text)}
.latest{font-size:10.5px;font-weight:700;color:var(--green);background:var(--mint);padding:1px 7px;border-radius:999px;
  opacity:0;transform:scale(.6);transition:opacity var(--t-med),transform var(--t-med) var(--ease-spring)}
.latest.show{opacity:1;transform:scale(1)}
.brand-desc{font-size:12px;color:var(--muted);margin-top:2px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Card ---------- */
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px;border:1px solid var(--line);
  box-shadow:0 2px 6px rgba(60,40,20,.04);animation:rise .45s var(--ease-out) both}
.card:nth-child(2){animation-delay:.06s}.card:nth-child(3){animation-delay:.12s}.card:nth-child(4){animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.card-head{display:flex;align-items:center;gap:12px}
.badge{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:0 0 auto;transition:transform var(--t-med) var(--ease-spring)}
.badge svg{width:24px;height:24px}
.badge.peach{background:var(--peach);color:var(--peach-ink)}
.badge.sky{background:var(--sky);color:var(--sky-ink)}
.badge.rose{background:var(--red-soft);color:var(--red)}
.badge.mint{background:var(--mint);color:var(--green)}
.card.on .badge{animation:wiggle .5s var(--ease-out)}
@keyframes wiggle{30%{transform:rotate(-12deg) scale(1.08)}60%{transform:rotate(9deg)}100%{transform:none}}
.card-title{flex:1;min-width:0}
.card-title b{display:block;font-size:15.5px}
.card-title small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--soft);color:#5d6068}
.chip.time{font-variant-numeric:tabular-nums;font-weight:600}
.status-box{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--sky);color:var(--sky-ink);font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}
.status-box svg{width:16px;height:16px;flex:0 0 auto}
.row-btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* ---------- Switch ---------- */
.sw{position:relative;width:50px;height:30px;flex:0 0 auto;cursor:pointer}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sw .track{position:absolute;inset:0;border-radius:999px;background:#E3DED6;transition:background-color var(--t-med)}
.sw .knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.18);
  transition:transform var(--t-med) var(--ease-spring),width var(--t-fast)}
.sw input:checked ~ .track{background:var(--red)}
.sw input:checked ~ .knob{transform:translateX(20px)}
.sw:active .knob{width:28px}
.sw input:checked:active ~ .knob{transform:translateX(16px)}

/* ---------- Buttons ---------- */
.btn{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--soft);color:var(--text);
  font:600 13.5px/1 inherit;font-family:inherit;padding:0 16px;height:44px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;
  transition:background-color var(--t-fast),border-color var(--t-fast),color var(--t-fast),box-shadow var(--t-med) var(--ease-out),transform var(--t-med) var(--ease-out)}
.btn svg{width:17px;height:17px}
.btn:hover{border-color:var(--red);transform:translateY(-1px)}
.btn:active{transform:scale(.95);transition-duration:.06s}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;width:100%;justify-content:center;height:48px}
.btn.primary:hover{background:#F04447;box-shadow:0 6px 16px rgba(229,56,59,.32)}
.btn.primary::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg)}
.btn.primary:hover::after{animation:sheen .6s var(--ease-out)}
@keyframes sheen{to{left:130%}}
.btn.done{background:var(--mint);border-color:#CBEBD6;color:var(--green)}
/* gợn sóng khi chạm */
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.18;transform:scale(0);pointer-events:none;animation:rip .5s var(--ease-out) forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}

/* ---------- Quyền ---------- */
.perm-list{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.perm-list li{display:flex;align-items:center;gap:10px;font-size:13px;padding:8px 10px;border-radius:10px;background:#FBFAF8}
.dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.dot svg{width:12px;height:12px}
.dot.ok{background:var(--mint);color:var(--green)}
.dot.bad{background:var(--red-soft);color:var(--red)}
.dot.pop{animation:pop .32s var(--ease-spring)}
@keyframes pop{from{transform:scale(0)}}

.credit{text-align:right;color:#A9ADB4;font-size:11px;padding:6px 18px 12px;flex:0 0 auto}

/* ---------- Toast ---------- */
.toast{position:absolute;left:50%;bottom:44px;transform:translate(-50%,20px);opacity:0;background:#2A2D33;color:#fff;
  font-size:12.5px;padding:10px 14px;border-radius:12px;border-left:3px solid var(--red);max-width:86%;
  transition:opacity .2s,transform .32s var(--ease-spring);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Màn trong: 2 cột ---------- */
.inner .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.inner .cols > div{min-width:0}

/* ---------- Màn báo toàn màn hình ---------- */
.alarm{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;
  background:radial-gradient(circle at 50% 35%,#FFF6E8 0%,var(--bg) 60%)}
.alarm.data{background:radial-gradient(circle at 50% 35%,#EAF1FA 0%,var(--bg) 60%)}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;position:relative;margin-bottom:26px}
.ring::before,.ring::after{content:'';position:absolute;inset:0;border-radius:50%;background:var(--peach-ink);opacity:.18;animation:pulse 2s var(--ease-out) infinite}
.alarm.data .ring::before,.alarm.data .ring::after{background:var(--sky-ink)}
.ring::after{animation-delay:1s}
@keyframes pulse{from{transform:scale(.7);opacity:.35}to{transform:scale(1.35);opacity:0}}
.ring .core{width:110px;height:110px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 10px 26px rgba(60,40,20,.12);color:var(--peach-ink);position:relative;z-index:1}
.alarm.data .ring .core{color:var(--sky-ink)}
.ring .core svg{width:56px;height:56px;animation:shake 1.2s ease-in-out infinite;transform-origin:50% 20%}
@keyframes shake{0%,50%,100%{transform:rotate(0)}10%{transform:rotate(-12deg)}20%{transform:rotate(10deg)}30%{transform:rotate(-8deg)}40%{transform:rotate(5deg)}}
.alarm .clock{font-size:46px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:1px;margin-bottom:4px}
.alarm h2{margin:0 0 6px;font-size:22px}
.alarm p{margin:0 0 30px;color:var(--muted);font-size:14.5px;max-width:300px}
.alarm .btn.primary{max-width:320px;height:54px;font-size:16px;border-radius:16px}
.alarm .hint{margin-top:14px;font-size:12px;color:#A9ADB4}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="page">
  <h1>Mondiro Timer Alarm — preview layout mới (tông sáng)</h1>
  <p class="note">Bấm thử công tắc, nút "Test", "Quét lại tin nhắn", "Bật đủ quyền" và nút kiểm tra cập nhật (góc phải trên) để xem animation. Màn ngoài = 1 cột, màn trong = 2 cột.</p>
  <div class="seg" id="seg">
    <button class="on" data-v="main">Màn hình chính</button>
    <button data-v="bf">Báo ăn sáng</button>
    <button data-v="data">Báo 3G/4G</button>
  </div>
  <div class="devices" id="devices"></div>
</div>

<!-- ===== Template màn hình chính ===== -->
<template id="tpl-main">
  <div class="status"><span>9:41</span><span>●●● 5G 87%</span></div>
  <div class="scroll">
    <header class="top">
      <img class="brand-icon" alt="" src="data:image/svg+xml;utf8,ICON">
      <div class="brand-text">
        <div class="brand-name"><span class="m">Mondiro</span><span class="a">Timer Alarm</span><span class="latest">latest</span></div>
        <div class="brand-desc">Nhắc đồ ăn sáng &amp; hạn gói 3G/4G</div>
      </div>
      <button class="icon-btn js-update" title="Kiểm tra bản cập nhật" aria-label="Kiểm tra bản cập nhật">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>
      </button>
    </header>
    <div class="cols">
      <div>
        <!-- Card ăn sáng -->
        <section class="card js-card">
          <div class="card-head">
            <div class="badge peach"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 0 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"/><path d="M7 2v2M11 2v2M15 2v2"/></svg></div>
            <div class="card-title"><b>Mua đồ ăn sáng cho ba</b><small>Mỗi ngày, tự kết thúc lúc 12:00</small></div>
            <label class="sw"><input type="checkbox" class="js-sw" checked><span class="track"></span><span class="knob"></span></label>
          </div>
          <div class="chips"><span class="chip time">11:00</span><span class="chip">15 phút / lần</span><span class="chip">đến 12:00</span></div>
          <div class="row-btns">
            <button class="btn js-test"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 4 20 12 6 20 6 4"/></svg>Test</button>
          </div>
        </section>
        <!-- Card 3G -->
        <section class="card js-card">
          <div class="card-head">
            <div class="badge sky"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><path d="M2 9a14 14 0 0 1 20 0"/><circle cx="12" cy="19.5" r="1"/></svg></div>
            <div class="card-title"><b>Nạp 3G/4G</b><small>Báo trước 1 ngày, 6h nhắc lại 1 lần</small></div>
            <label class="sw"><input type="checkbox" class="js-sw" checked><span class="track"></span><span class="knob"></span></label>
          </div>
          <div class="status-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Hết hạn: 23:59 ngày 18/10/2026</div>
          <div class="row-btns">
            <button class="btn js-scan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>Quét lại tin nhắn</button>
            <button class="btn js-test"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 4 20 12 6 20 6 4"/></svg>Test</button>
          </div>
        </section>
      </div>
      <div>
        <!-- Card quyền -->
        <section class="card">
          <div class="card-head">
            <div class="badge rose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
            <div class="card-title"><b>Quyền để màn báo tự bật</b><small>Cần đủ 3 quyền để báo đè lên app khác</small></div>
          </div>
          <ul class="perm-list">
            <li><span class="dot ok">OK</span>Hiển thị trên các ứng dụng khác</li>
            <li><span class="dot bad">X</span>Toàn màn hình khi khoá máy</li>
            <li><span class="dot bad">X</span>Không hạn chế pin</li>
          </ul>
          <div class="row-btns"><button class="btn primary js-perm">Bật đủ quyền</button></div>
        </section>
        <!-- Card âm thanh -->
        <section class="card js-card">
          <div class="card-head">
            <div class="badge mint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></div>
            <div class="card-title"><b>Âm thanh khi báo</b><small>Thêm chuông (ngoài rung) cho cả 2 mục</small></div>
            <label class="sw"><input type="checkbox" class="js-sw"><span class="track"></span><span class="knob"></span></label>
          </div>
        </section>
      </div>
    </div>
  </div>
  <div class="credit">Created by Mondiro</div>
  <div class="toast"></div>
</template>

<!-- ===== Template màn báo ===== -->
<template id="tpl-alarm">
  <div class="status"><span>11:00</span><span>●●● 5G 87%</span></div>
  <div class="alarm KIND">
    <div class="ring"><div class="core">ICON</div></div>
    <div class="clock">TIME</div>
    <h2>TITLE</h2>
    <p>SUB</p>
    <button class="btn primary js-dismiss">Đã hiểu</button>
    <div class="hint">Lịch nhắc vẫn giữ nguyên — tắt công tắc trong app để ngưng hẳn</div>
  </div>
  <div class="credit">Created by Mondiro</div>
</template>

<script>
const ICON_SVG = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'>
<defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#FFFFFF'/><stop offset='1' stop-color='#F3EEE7'/></linearGradient>
<linearGradient id='r' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#F05456'/><stop offset='1' stop-color='#D92F32'/></linearGradient></defs>
<rect width='512' height='512' rx='112' fill='url(#g)'/>
<rect x='118' y='96' width='92' height='44' rx='22' fill='url(#r)' transform='rotate(-28 164 118)'/>
<rect x='302' y='96' width='92' height='44' rx='22' fill='url(#r)' transform='rotate(28 348 118)'/>
<circle cx='256' cy='286' r='150' fill='url(#r)'/>
<circle cx='256' cy='286' r='118' fill='#FFF8EF'/>
<path d='M256 206v84l56 34' fill='none' stroke='#2A2D33' stroke-width='26' stroke-linecap='round' stroke-linejoin='round'/>
<circle cx='256' cy='290' r='16' fill='#2A2D33'/>
<circle cx='384' cy='398' r='34' fill='#F2B84B' stroke='#fff' stroke-width='12'/></svg>`;
const iconUri = encodeURIComponent(ICON_SVG);
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const CROSS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const CUP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 0 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"/><path d="M7 2v2M11 2v2M15 2v2"/></svg>';
const WIFI = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><path d="M2 9a14 14 0 0 1 20 0"/><circle cx="12" cy="19.5" r="1"/></svg>';

function render(view){
  const host = document.getElementById('devices'); host.innerHTML='';
  [['outer','Màn ngoài Z Fold 7 (2520×1080)'],['inner','Màn trong Z Fold 7 (2184×1968)']].forEach(([cls,cap])=>{
    const dev=document.createElement('div');dev.className='dev '+cls;
    let html;
    if(view==='main'){
      html=document.getElementById('tpl-main').innerHTML.replace('ICON',iconUri);
    }else{
      const bf=view==='bf';
      html=document.getElementById('tpl-alarm').innerHTML
        .replace('KIND',bf?'':'data').replace('ICON',bf?CUP:WIFI)
        .replace('TIME',bf?'11:00':'09:00')
        .replace('TITLE',bf?'Mua đồ ăn sáng cho ba':'Gói 3G/4G sắp hết hạn')
        .replace('SUB',bf?'Đã 11:00 — nhớ đặt/mua đồ ăn sáng cho Ba nhé.':'Gói data hết hạn lúc 23:59 ngày 18/10. Kiểm tra và mua gói mới nhé.');
    }
    dev.innerHTML=`<div class="phone"><div class="screen">${html}</div></div><div class="cap">${cap}</div>`;
    host.appendChild(dev);
    wire(dev);
  });
  if(view==='main') document.querySelectorAll('.perm-list .dot').forEach(d=>d.innerHTML=d.classList.contains('ok')?CHECK:CROSS);
}

function toast(scr,msg){const t=scr.querySelector('.toast');if(!t)return;t.textContent=msg;t.classList.add('show');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}

function wire(dev){
  const scr=dev.querySelector('.screen');
  scr.querySelectorAll('.btn,.icon-btn').forEach(b=>b.addEventListener('pointerdown',e=>{
    const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height)*2,sp=document.createElement('span');
    sp.className='ripple';sp.style.width=sp.style.height=s+'px';sp.style.left=(e.clientX-r.left-s/2)+'px';sp.style.top=(e.clientY-r.top-s/2)+'px';
    b.appendChild(sp);setTimeout(()=>sp.remove(),520)}));
  scr.querySelectorAll('.js-sw').forEach(sw=>sw.addEventListener('change',()=>{
    const c=sw.closest('.card');c.classList.remove('on');void c.offsetWidth;if(sw.checked)c.classList.add('on')}));
  scr.querySelectorAll('.js-test').forEach(b=>b.addEventListener('click',()=>toast(scr,'Đã hẹn 15 giây. Hãy khoá màn hình hoặc mở app khác rồi chờ.')));
  scr.querySelectorAll('.js-scan').forEach(b=>b.addEventListener('click',()=>{
    const s=b.querySelector('svg');s.style.animation='spin .8s linear infinite';b.disabled=true;
    setTimeout(()=>{s.style.animation='';b.disabled=false;toast(scr,'Đã cập nhật ngày hết hạn từ tin nhắn cũ.')},1200)}));
  scr.querySelectorAll('.js-perm').forEach(b=>b.addEventListener('click',()=>{
    const bad=scr.querySelector('.dot.bad');
    if(bad){bad.className='dot ok pop';bad.innerHTML=CHECK}
    if(!scr.querySelector('.dot.bad')){b.classList.remove('primary');b.classList.add('done');b.style.width='100%';b.style.justifyContent='center';b.innerHTML=CHECK.replace('<svg','<svg style="width:17px;height:17px"')+'Đã bật đủ quyền'}
  }));
  scr.querySelectorAll('.js-update').forEach(b=>b.addEventListener('click',()=>{
    const tag=scr.querySelector('.latest');tag.classList.remove('show');b.classList.add('spin');
    setTimeout(()=>{b.classList.remove('spin');tag.classList.add('show');toast(scr,'Bạn đang dùng bản mới nhất.')},1000)}));
  scr.querySelectorAll('.js-dismiss').forEach(b=>b.addEventListener('click',()=>{
    const a=scr.querySelector('.alarm');a.style.transition='opacity .3s, transform .3s';a.style.opacity=0;a.style.transform='scale(.96)';
    setTimeout(()=>{a.style.opacity=1;a.style.transform=''},900)}));
}

document.getElementById('seg').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));render(b.dataset.v)});
render('main');
</script>
</body>
</html>
