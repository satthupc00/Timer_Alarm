name: Build APK

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept licenses & install Android SDK components
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Decode signing key (GitHub Secrets)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mondiro.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/mondiro.jks" >> "$GITHUB_ENV"
            echo "Đã có khoá ký cố định."
          else
            echo "::warning::Chưa có secret SIGNING_KEYSTORE_BASE64 - APK ký bằng khoá debug tạm, KHÔNG phát hành bản tự cập nhật."
          fi

      - name: Build release APK
        id: build
        continue-on-error: true
        shell: bash
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace 2>&1 | tee build_log.txt

      - name: Report failure details as commit comment
        if: steps.build.outcome == 'failure'
        run: |
          ERR=$(tail -c 55000 build_log.txt)
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d "$(jq -n --arg body "$ERR" '{body: $body}')"

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Rename APK with version
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          APK="Mondiro-TimerAlarm-v${VERSION}.apk"
          cp app/build/outputs/apk/release/*.apk "$APK"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mondiro-TimerAlarm-v${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.file }}

      # Phát hành bản tự cập nhật: chỉ trên nhánh main, chỉ khi có khoá ký cố định,
      # và chỉ khi tag v<versionName> chưa tồn tại (muốn phát hành bản mới thì tăng versionName).
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && env.SIGNING_KEYSTORE_PATH != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.apk.outputs.version }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG đã có - bỏ qua."
          else
            gh release create "$TAG" "${{ steps.apk.outputs.file }}" \
              --title "Mondiro Timer Alarm $TAG" \
              --notes-file RELEASE_NOTES.md
          fi
